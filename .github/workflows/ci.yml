name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Actions evicts caches LRU against a 10 GB repo-wide budget, so the ceiling
  # here is what keeps one branch's entry from crowding out the others'.
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPRESS: "true"
  # mono/mini/buildver-*.h is generated with the wall-clock build date in it.
  # cmake/MonoGenBuildVer.cmake honours SOURCE_DATE_EPOCH, so pinning it keeps
  # main.c and main-sgen.c cacheable too.
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  # ---------------------------------------------------------------------------
  # One build, because there is one configuration. The backend is the runtime's
  # only JIT: mini-runtime.c calls mono_llvm_jit_compile_method () and eighteen
  # siblings unguarded, and mono/CMakeLists.txt compiles the only definition of
  # them under MONO_ENABLE_LLVM, so a build with the tier off does not link.
  #
  # The tests then run in shards against this job's build tree rather than
  # rebuilding it. Testing was 74% of the wall clock when it was one job.
  # ---------------------------------------------------------------------------
  build:
    name: Build (Clang)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # roslyn-binaries, corefx, cecil, boringssl and bdwgc are all build
          # inputs.  The acceptance corpora are `update = none` in .gitmodules,
          # so `recursive` still skips the gigabyte of them.
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/deps

      # Keyed on the commit so every run writes a fresh entry and the restore-key
      # picks up the newest older one: a cache entry is immutable once written,
      # so a fixed key would freeze at whatever the very first run compiled.
      # Branch isolation comes from Actions' own cache scoping, not from the key.
      #
      # Restore and save are separate steps because the combined action saves in
      # a post step, and a post step does not run for a cancelled job and is
      # skipped for a failed one. With cancel-in-progress on and the suite
      # downstream, that lost every entry: four runs left the repo with no
      # ccache at all, and the fifth still compiled 1115 of 1271 objects cold
      # against sources it had already built once. Saving as soon as the build
      # succeeds is what makes the next run's hit rate a property of the
      # sources rather than of how the suite ended.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-linux-x64-${{ github.sha }}
          restore-keys: ccache-linux-x64-

      # Everything the managed outputs are compiled from, as one exact key.  A
      # tree SHA is instant and covers the whole subtree, where hashFiles () over
      # mcs/ alone would read 51233 files.  The distro mono is in it because
      # MONO_USE_SYSTEM_RUNTIME_FOR_TOOLS makes it the compiler these assemblies
      # come out of.
      - name: Managed build cache key
        id: managed-key
        run: |
          printf '%s\n' \
            "$(git rev-parse HEAD:mcs)" \
            "$(git rev-parse HEAD:cmake)" \
            "$(git rev-parse HEAD:mono/tests)" \
            "$(git rev-parse HEAD:external)" \
            "$(dpkg-query -W -f='${Version}' mono-devel)" \
            | sha256sum | cut -c1-40 \
            | sed 's/^/key=managed-linux-x64-v1-/' >> "$GITHUB_OUTPUT"

      # No restore-keys, deliberately.  The backdating below makes ninja trust
      # the restored outputs, so an inexact hit would serve assemblies compiled
      # from other sources and nothing downstream would notice.  A key that does
      # not match exactly has to miss and rebuild.
      - name: Restore managed build
        id: managed-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/mcs
            build/mono/tests
            build/.ninja_log
            build/.ninja_deps
          key: ${{ steps.managed-key.outputs.key }}

      # Ninja decides an edge is stale from the output mtime recorded in
      # .ninja_log, not from the file on disk, so touching the restored outputs
      # does nothing -- the inputs have to go back instead.  tar preserves the
      # output mtimes on the way in, and SOURCE_DATE_EPOCH is already older than
      # any of them.
      - name: Backdate sources behind the restored outputs
        if: steps.managed-cache.outputs.cache-hit == 'true'
        run: |
          find . -name .git -prune -o -path ./build -prune -o -print0 \
            | xargs -0r touch -h -d "@$SOURCE_DATE_EPOCH"

      # clang-18 rather than the default compiler, because that is what the
      # development box configures with, so a green run here is a green run of
      # the configuration people build.  The GCC job below is what covers the
      # other toolchain accepting the sources.
      #
      # MONO_USE_SYSTEM_RUNTIME_FOR_TOOLS hosts Roslyn on the distro mono rather
      # than the one being built, which is worth roughly 4x on the C# half and
      # takes it off the critical path behind the native link.  Only the
      # compiler's host moves; the tests still run on the runtime built here.
      #
      # MONO_UNITY_BUILD statically links LLVM the way a Unity player does,
      # instead of the libLLVM.so apt.llvm.org ships otherwise, so CI covers
      # that link shape too.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DMONO_LLVM_PREFIX=/usr/lib/llvm-23 \
            -DCMAKE_INSTALL_PREFIX="$PWD/tmp" \
            -DMONO_USE_SYSTEM_RUNTIME_FOR_TOOLS=ON \
            -DMONO_UNITY_BUILD=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        id: build
        run: cmake --build build -j "$(nproc)"

      # A hit restored exactly what this key describes, so there is nothing new
      # to write back.
      - name: Save managed build
        if: >-
          steps.build.outcome == 'success' &&
          steps.managed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/mcs
            build/mono/tests
            build/.ninja_log
            build/.ninja_deps
          key: ${{ steps.managed-key.outputs.key }}

      - name: Save ccache
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-linux-x64-${{ github.sha }}

      - name: ccache statistics
        run: ccache --show-stats --verbose

      - name: Runtime identifies itself
        run: |
          ./build/mono/mini/mono-sgen --version
          ./build/mono/mini/mono-sgen --version | grep -q 'LLVM:.*yes'

      - name: Package the KSP zip
        run: cmake --build build --target package-ksp -j "$(nproc)"

      # upload-artifact zips whatever `path` names, so pointing it at the zip
      # package-ksp already built would nest that zip inside the download's
      # own. Extracting first and uploading the directory gives the
      # downloaded artifact the package's own layout instead.
      - name: Extract the KSP package
        run: |
          mkdir ksp-package-linux
          unzip -q build/mono-llvm-jit-ksp-linux.zip -d ksp-package-linux

      - name: Upload the KSP package
        uses: actions/upload-artifact@v7
        with:
          name: ksp-package-linux-x64
          path: ksp-package-linux
          if-no-files-found: error

      # The whole tree rather than a selection of it. 1.6G goes to 410M in 18s,
      # which is far below what any pruning could be worth, and a prune that
      # dropped a data file some corpus reads would surface as one red test in
      # one shard rather than as a missing file.
      #
      # zstd rather than the artifact's own zip, which single-threads deflate
      # over the whole tree. The upload then compresses a compressed file, so
      # compression-level 0 keeps it from paying for that twice.
      - name: Pack the build tree
        run: tar -I 'zstd -3 -T0' -cf build.tzst build

      - name: Upload the build tree
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-linux-x64
          path: build.tzst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # The native half under gcc. Everyone here configures with clang, so a
  # construct only g++ rejects reaches the branch unreported.
  #
  # Nothing downstream consumes this job: the tests run against the clang tree
  # above, and a second toolchain's runtime answers the same questions. It also
  # takes no `needs`, so it runs beside that build and costs the run only what
  # it is slower by.
  # ---------------------------------------------------------------------------
  build-gcc:
    name: Build (GCC)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/deps

      # A key of its own. A cache entry is immutable once written, so two jobs
      # saving one key means the second save is refused and its objects are
      # gone -- and ccache hashes the compiler, so neither job's objects would
      # answer the other anyway.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-linux-x64-gcc-${{ github.sha }}
          restore-keys: ccache-linux-x64-gcc-

      # MONO_ENABLE_MCS_BUILD=OFF is what makes this the native half. The class
      # libraries are Roslyn's output and no C++ compiler reaches them, so
      # building them again here would report on nothing this job is about.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DMONO_LLVM_PREFIX=/usr/lib/llvm-23 \
            -DCMAKE_INSTALL_PREFIX="$PWD/tmp" \
            -DMONO_ENABLE_MCS_BUILD=OFF \
            -DMONO_UNITY_BUILD=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        id: build
        run: cmake --build build -j "$(nproc)"

      - name: Save ccache
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-linux-x64-gcc-${{ github.sha }}

      - name: ccache statistics
        run: ccache --show-stats --verbose

  # ---------------------------------------------------------------------------
  # ctest's own index filter is the shard: `-I <n>,,<count>` takes every count'th
  # test from the filtered list, so the shards partition it with no overlap and
  # no gaps, and nothing has to be checked in and kept current. Order comes from
  # the generated CTestTestfile.cmake, which is the build job's own file here,
  # so every shard indexes the same list.
  #
  # `strategy.job-total` is the count, so changing the shard list below is the
  # whole edit.
  #
  # The selection is what the six per-suite steps this replaces added up to, and
  # it is exactly that: the union was 11948 tests and this is the same 11948.
  # `slow` is disjoint from all of them -- it is entirely bcl -- so excluding it
  # here drops nothing the suites were running.
  # ---------------------------------------------------------------------------
  test:
    name: Test ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      # A shard that goes red must not take the other seven with it, or a
      # failure names one family and hides the rest.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      # The build tree's CTestTestfile.cmake names 5332 paths under mono/ and
      # 5274 under cmake/, and one `tools` test runs csi.exe out of the
      # roslyn-binaries submodule, so a shard needs the source tree as checked
      # out for the build. The runner puts it at the same GITHUB_WORKSPACE in
      # every job, which is what makes those absolute paths resolve here.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/deps

      - name: Download the build tree
        uses: actions/download-artifact@v8
        with:
          name: build-tree-linux-x64

      - name: Unpack the build tree
        run: tar --zstd -xf build.tzst

      # Cheap and immediate: a tree that did not survive the round trip, or an
      # LLVM the shard cannot load, fails here rather than as 1494 red tests.
      - name: Runtime identifies itself
        run: |
          ./build/mono/mini/mono-sgen --version
          ./build/mono/mini/mono-sgen --version | grep -q 'LLVM:.*yes'

      # apt.llvm.org builds LLVM with LLVM_ENABLE_ASSERTIONS OFF, so nothing
      # here catches the API misuse an assertions build would. What an
      # assertions build also turns on by itself is reachable without one:
      # MONO_LLVM_JIT_VERIFY runs the IR verifier over the translator's output,
      # over the module after each pass written here, and over the module
      # codegen is handed, for 11-15% of compile CPU.
      #
      # interp-mixed is left out for the reason check-all leaves it out: it is
      # red on a backend defect it exists to report.
      - name: Test
        env:
          MONO_LLVM_JIT_VERIFY: "1"
        run: >
          ctest --test-dir build -j "$(nproc)" --output-on-failure
          --output-junit junit-shard-${{ matrix.shard }}.xml
          -LE "bcl|slow|stress|acceptance|interp-mixed"
          -I ${{ matrix.shard }},,${{ strategy.job-total }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-x64-${{ matrix.shard }}
          path: |
            build/junit-*.xml
            build/Testing/Temporary/LastTest*.log
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    name: Build (clang-cl)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    timeout-minutes: 180

    env:
      LLVM_VERSION: 23.1.1
      LLVM_PREFIX: C:\llvm
      MONO_CCACHE_VERSION: "4.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore LLVM
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.LLVM_PREFIX }}
          key: llvm-win64-${{ env.LLVM_VERSION }}

      - name: Download LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$name.tar.xz"
          curl.exe -fsSL --retry 3 -o llvm.tar.xz $url
          New-Item -ItemType Directory -Force -Path C:\llvm-unpack | Out-Null
          tar -xf llvm.tar.xz -C C:\llvm-unpack
          Move-Item "C:\llvm-unpack\$name" $env:LLVM_PREFIX
          Remove-Item -Recurse -Force C:\llvm-unpack, llvm.tar.xz
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
            "$env:LLVM_PREFIX\share", "$env:LLVM_PREFIX\libexec"
          Remove-Item -Force -ErrorAction SilentlyContinue `
            "$env:LLVM_PREFIX\bin\flang*.exe", "$env:LLVM_PREFIX\bin\mlir*.exe", `
            "$env:LLVM_PREFIX\bin\lldb*.exe", "$env:LLVM_PREFIX\bin\clangd.exe", `
            "$env:LLVM_PREFIX\bin\clang-tidy.exe", "$env:LLVM_PREFIX\bin\clang-query.exe"

      - name: Save LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LLVM_PREFIX }}
          key: llvm-win64-${{ env.LLVM_VERSION }}

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: build/vcpkg_installed
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/**') }}

      # The image ships ccache 4.9.1, which caches almost nothing here.
      # CCACHE_BASEDIR (cmake/MonoCompilerFlags.cmake) turns the build
      # directory's -I into `-I.`, and clang then names the generated config.h
      # through it in a spelling ccache cannot stat back. 4.9.1 treats an
      # include it cannot stat as fatal: it reports `bad_input_file` and
      # compiles uncached. Nearly every translation unit includes config.h.
      # 4.10 allows one again, which its own NEWS calls a 4.9.1 regression.
      #
      # This goes in front of the action below, which takes whichever ccache is
      # on PATH.
      - name: Install ccache
        shell: pwsh
        run: |
          $name = "ccache-$env:MONO_CCACHE_VERSION-windows-x86_64"
          $url = "https://github.com/ccache/ccache/releases/download/v$env:MONO_CCACHE_VERSION/$name.zip"
          curl.exe -fsSL --retry 3 -o ccache.zip $url
          Expand-Archive -Path ccache.zip -DestinationPath C:\ccache-dl
          Remove-Item -Force ccache.zip
          "C:\ccache-dl\$name" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # v2 because 4.14 reads none of the entries 4.9.1 wrote, so the old key
      # is a download nothing reads.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-windows-x64-v2
          max-size: 3G

      # _mono_csc_command () hands csc.exe to the host here, so the class
      # libraries need no mono. The test corpora go through
      # mono_tools_runtime (), which compiles them on the runtime
      # MONO_USE_SYSTEM_RUNTIME_FOR_TOOLS names below.
      - name: Install mono
        shell: pwsh
        run: |
          choco install mono --no-progress -y
          "$env:ProgramFiles\Mono\bin" `
            | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # BoringSSL assembles its x86_64 asm with nasm. The copy CMake finds on
      # this image is Strawberry Perl's, so without this step the btls build
      # depends on a package nothing here asks for.
      - name: Install nasm
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "$env:ProgramFiles\NASM" `
            | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Managed build cache key
        id: managed-key
        shell: bash
        run: |
          mono --version | head -1
          printf '%s\n' \
            "$(git rev-parse HEAD:mcs)" \
            "$(git rev-parse HEAD:cmake)" \
            "$(git rev-parse HEAD:mono/tests)" \
            "$(git rev-parse HEAD:external)" \
            "$(mono --version | head -1)" \
            | sha256sum | cut -c1-40 \
            | sed 's/^/key=managed-windows-x64-v1-/' >> "$GITHUB_OUTPUT"

      - name: Restore managed build
        id: managed-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/mcs
            build/mono/tests
            build/.ninja_log
            build/.ninja_deps
          key: ${{ steps.managed-key.outputs.key }}

      - name: Backdate sources behind the restored outputs
        if: steps.managed-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          find . -name .git -prune -o -path ./build -prune -o -print0 \
            | xargs -0r touch -h -d "@$SOURCE_DATE_EPOCH"

      # CMakeLists.txt enables ASM_MASM on Windows, so the build needs ml64.exe
      # in PATH, and vcvars64 is what puts it there. It pins INCLUDE and LIB too.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 173 of the 232 seconds a cold configure takes here are try_compile, and
      # every one of them writes its answer to CMakeCache.txt, where the next
      # configure reads it instead of probing again. A warm cache configures in
      # about 20 seconds.
      #
      # So the key has to name everything a probe answer can turn on, and each
      # one has to be present: an empty component would not fail anything, it
      # would quietly widen the key. The four that decide an answer are the
      # compiler, the headers it reads, CMake's own check modules, and the
      # runtime the build compiles C# on. This runs after vcvars, which is what
      # sets the first two.
      - name: CMake configure cache key
        id: cmake-key
        shell: bash
        run: |
          : "${VCToolsVersion:?vcvars did not run}"
          : "${WindowsSDKVersion:?vcvars did not run}"
          : "${LLVM_VERSION:?}"
          printf '%s\n' \
            "$(git rev-parse HEAD:cmake)" \
            "$(git ls-files -s '*CMakeLists.txt' vcpkg.json 'vcpkg-triplets/*' | sha256sum)" \
            "$VCToolsVersion" "$WindowsSDKVersion" "$LLVM_VERSION" \
            "$(cmake --version | head -1)" \
            "$(mono --version | head -1)" \
            | sha256sum | cut -c1-40 \
            | sed 's/^/key=cmake-windows-x64-v1-/' >> "$GITHUB_OUTPUT"

      # No restore-keys, for the reason the managed build cache gives: an
      # inexact hit here is a probe answer from another toolchain, and nothing
      # downstream would notice.
      #
      # CMakeConfigureLog.yaml is 22 of the 24 MB and is only a log of the
      # probes. CMake appends to it, or writes a new one.
      - name: Restore the CMake configure cache
        id: cmake-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/CMakeCache.txt
            build/CMakeFiles
            !build/CMakeFiles/CMakeConfigureLog.yaml
          key: ${{ steps.cmake-key.outputs.key }}

      - name: Configure
        id: configure
        shell: pwsh
        run: |
          # ccache refuses /Zi, CMAKE_MSVC_DEBUG_INFORMATION_FORMAT's default:
          # that debug info goes to a PDB shared across the target, so the object
          # is not the whole output. Embedded is /Z7, which puts it in the object.
          #
          # The LLVM release tarball is built with libxml2, so LLVMConfig.cmake
          # looks for one. This image has none, and FindLibXml2 spends 16
          # seconds establishing that on every configure -- a find_ that lands
          # on NOTFOUND searches again next time rather than reading the cache.
          # Nothing here links it, which is what the miss already proves.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER="$env:LLVM_PREFIX/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="$env:LLVM_PREFIX/bin/clang-cl.exe" `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DCMAKE_DISABLE_FIND_PACKAGE_LibXml2=ON `
            -DMONO_LLVM_PREFIX="$env:LLVM_PREFIX" `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/tmp" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DMONO_USE_SYSTEM_RUNTIME_FOR_TOOLS=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Saved here rather than after the build, because a build that fails
      # leaves the probe answers as good as one that succeeds, and because
      # CMakeFiles/ collects per-target directories once the build starts.
      - name: Save the CMake configure cache
        if: >-
          steps.configure.outcome == 'success' &&
          steps.cmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/CMakeCache.txt
            build/CMakeFiles
            !build/CMakeFiles/CMakeConfigureLog.yaml
          key: ${{ steps.cmake-key.outputs.key }}

      - name: Build
        id: build
        shell: pwsh
        run: cmake --build build -j $env:NUMBER_OF_PROCESSORS

      - name: Save vcpkg packages
        if: >-
          steps.build.outcome == 'success' &&
          steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/vcpkg_installed
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/**') }}

      - name: Save managed build
        if: >-
          steps.build.outcome == 'success' &&
          steps.managed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/mcs
            build/mono/tests
            build/.ninja_log
            build/.ninja_deps
          key: ${{ steps.managed-key.outputs.key }}

      - name: ccache statistics
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          which ccache
          ccache --version | head -1
          ccache --show-stats --verbose

      - name: Runtime identifies itself
        shell: bash
        run: |
          ./build/mono/mini/mono-sgen.exe --version
          ./build/mono/mini/mono-sgen.exe --version | grep -q 'LLVM:.*yes'

      - name: Pack the build tree
        shell: bash
        run: tar --exclude='*.obj' -I 'zstd -3 -T0' -cf build.tzst build

      - name: Upload the build tree
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-windows-x64
          path: build.tzst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      # Package after archiving the build tree to keep the large ZIP and its
      # staging files out of build.tzst, which every test shard downloads.
      - name: Package the KSP zip
        shell: pwsh
        run: cmake --build build --target package-ksp -j $env:NUMBER_OF_PROCESSORS

      # See the Linux job's own "Extract the KSP package" step for why this
      # has to happen before the upload.
      - name: Extract the KSP package
        shell: pwsh
        run: Expand-Archive -Path build/mono-llvm-jit-ksp-windows.zip -DestinationPath ksp-package-windows

      - name: Upload the KSP package
        uses: actions/upload-artifact@v7
        with:
          name: ksp-package-windows-x64
          path: ksp-package-windows
          if-no-files-found: error

  test-windows:
    name: Test Windows ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: build-windows
    runs-on: windows-2025
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download the build tree
        uses: actions/download-artifact@v8
        with:
          name: build-tree-windows-x64

      - name: Unpack the build tree
        shell: bash
        run: tar --zstd -xf build.tzst

      - name: Runtime identifies itself
        shell: bash
        run: |
          ./build/mono/mini/mono-sgen.exe --version
          ./build/mono/mini/mono-sgen.exe --version | grep -q 'LLVM:.*yes'

      - name: Test
        shell: bash
        env:
          MONO_LLVM_JIT_VERIFY: "1"
        run: >
          ctest --test-dir build -j "$NUMBER_OF_PROCESSORS" --output-on-failure
          --output-junit junit-shard-${{ matrix.shard }}.xml
          -LE "bcl|slow|stress|acceptance|interp-mixed"
          -I ${{ matrix.shard }},,${{ strategy.job-total }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-x64-${{ matrix.shard }}
          path: |
            build/junit-*.xml
            build/Testing/Temporary/LastTest*.log
          if-no-files-found: warn
          retention-days: 14
