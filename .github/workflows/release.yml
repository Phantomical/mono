name: Release (2019.4)

on:
  release:
    types: [published]
  push:
    branches: [etw-2019.4]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Release build (Linux)
    # The oldest Ubuntu GitHub hosts, so the libraries ask for the oldest glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # autogen.sh runs bdwgc's own autogen before configure checks out the
      # submodules, and bdwgc's nested libatomic_ops still names a git:// URL
      # GitHub no longer serves.
      - name: Check out bdwgc
        run: >
          git -c url.https://github.com/.insteadOf=git://github.com/
          submodule update --init --recursive external/bdwgc

      # The build runs genmdesc.py as `python`.
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config gettext python-is-python3

      # --disable-parallel-mark is what Unity's own Linux build passes.
      - name: Configure
        env:
          CFLAGS: -O2 -g -fPIC
        run: >
          ./autogen.sh --prefix="$PWD/tmp" --host=x86_64-pc-linux-gnu
          --disable-mcs-build --disable-nls --disable-btls --with-mcs-docs=no
          --disable-parallel-mark

      - name: Build
        run: make -j"$(nproc)"

      - name: Runtime identifies itself
        run: ./mono/mini/mono-sgen --version

      - name: Package
        run: |
          dest=package/MonoBleedingEdge/x86_64
          mkdir -p "$dest"
          for lib in mono/mini/.libs/libmonobdwgc-2.0.so \
                     mono/mini/.libs/libmonosgen-2.0.so \
                     support/.libs/libMonoPosixHelper.so; do
            name=$(basename "$lib")
            cp -L "$lib" "$dest/$name"
            objcopy --only-keep-debug "$dest/$name" "$dest/$name.debug"
            strip --strip-debug --strip-unneeded "$dest/$name"
            objcopy --add-gnu-debuglink="$dest/$name.debug" "$dest/$name"
          done
          echo "Newest glibc symbol version each library asks for:"
          for so in "$dest"/*.so; do
            printf '  %s: ' "$(basename "$so")"
            objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          done
          (cd package && zip -r ../mono-2019.4-etw-linux-x64.zip MonoBleedingEdge)

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: mono-2019.4-etw-linux-x64.zip
          compression-level: 0
          if-no-files-found: error

  build-windows:
    name: Release build (Windows)
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only these two are needed for the runtime, and bdwgc's nested
      # libatomic_ops still names a git:// URL GitHub no longer serves.
      - name: Check out the runtime's submodules
        run: >
          git -c url.https://github.com/.insteadOf=git://github.com/
          submodule update --init --recursive external/bdwgc external/ittapi

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # The projects name the v140 toolset and the 8.1 SDK, neither of which
      # the runner has.
      - name: Build
        shell: pwsh
        run: |
          $common = @(
            'msvc\mono.sln', '/m', '/nologo', '/v:m',
            '/p:Configuration=Release', '/p:Platform=x64',
            '/p:PlatformToolset=v143', '/p:WindowsTargetPlatformVersion=10.0'
          )
          foreach ($gc in 'bdwgc', 'sgen') {
            msbuild @common /t:Runtime\libmono-dynamic /p:MONO_TARGET_GC=$gc
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          msbuild @common /t:Libraries\monoposixhelper /p:MONO_TARGET_GC=bdwgc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $dest = 'package\MonoBleedingEdge\EmbedRuntime'
          New-Item -ItemType Directory -Force $dest | Out-Null
          foreach ($gc in 'bdwgc', 'sgen') {
            Copy-Item "msvc\build\$gc\x64\bin\Release\mono-2.0-$gc.dll", `
                      "msvc\build\$gc\x64\bin\Release\mono-2.0-$gc.pdb" $dest
          }
          Copy-Item 'msvc\build\bdwgc\x64\bin\Release\MonoPosixHelper.dll', `
                    'msvc\build\bdwgc\x64\bin\Release\MonoPosixHelper.pdb' $dest
          Compress-Archive -Path 'package\MonoBleedingEdge' `
            -DestinationPath 'mono-2019.4-etw-windows-x64.zip'

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: mono-2019.4-etw-windows-x64.zip
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build-linux, build-windows]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: packages
          merge-multiple: true

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >
          gh release upload "$TAG" packages/*.zip
          --repo "$GITHUB_REPOSITORY" --clobber
